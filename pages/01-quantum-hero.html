<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Hero Experience</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/quantum-supreme.css">
</head>
<body>
    <div class="quantum-hero-page" id="home">
        <canvas id="heroQuantumCanvas"></canvas>
        
        <div class="hero-quantum-content">
            <div class="hero-badge">
                <span class="quantum-icon"><i class="fas fa-atom"></i></span>
                <span>QUANTUM DEVELOPER // ONLINE</span>
            </div>
            
            <h1 class="quantum-hero-title">
                MOE KYAW AUNG
                <span class="title-line">ARCHITECT</span>
            </h1>
            
            <div class="hero-typewriter-container">
                <span class="typewriter-text" id="typewriterText"></span>
                <span class="typewriter-cursor">|</span>
            </div>
            
            <div class="hero-cta-quantum">
                <a href="#" class="btn quantum-primary-btn">
                    <span class="btn-icon"><i class="fas fa-eye"></i></span>
                    <span class="btn-text">OBSERVE REALITY</span>
                </a>
                <a href="#" class="btn quantum-contrast-btn">
                    <i class="fas fa-telegram-plane"></i> JOIN QUANTUM NETWORK
                </a>
            </div>
            
            <div class="hero-social-links">
                <a href="#" class="social-quantum"><i class="fab fa-github"></i></a>
                <a href="#" class="social-quantum"><i class="fab fa-linkedin-in"></i></a>
                <a href="#" class="social-quantum"><i class="fab fa-twitter"></i></a>
                <a href="#" class="social-quantum"><i class="fab fa-telegram"></i></a>
            </div>
        </div>
        
        <div class="hero-scroll-indicator">
            <span>SCOLL TO COLLAPSE WAVE</span>
            <div class="scroll-line"></div>
        </div>
    </div>
</body>
</html>
